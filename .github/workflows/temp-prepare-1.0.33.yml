name: Temporary Prepare 1.0.33

on:
  push:
    branches:
      - release/1.0.33

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.0.33
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical release preparation
        run: npm run release:prepare -- 1.0.33
      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ' | sed 's/ $//')"
          expected="manifest.json package-lock.json package.json versions.json"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected canonical release diff: $actual"
            exit 1
          fi
      - name: Commit prepared metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json manifest.json versions.json package-lock.json
          git commit -m 'chore: prepare release 1.0.33'
          git push origin HEAD:release/1.0.33
