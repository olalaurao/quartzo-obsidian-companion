name: Home daily projection wiring

on:
  push:
    branches:
      - feat/beta-product-completion
    paths:
      - scripts/wire-home-daily-projection.mjs
      - .github/workflows/home-daily-projection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-product-completion
          fetch-depth: 0
      - run: node scripts/wire-home-daily-projection.mjs
      - name: Commit Home wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/shell/view.ts
          git diff --cached --check
          git commit -m "feat(home): add Now and Up Next canonical buckets"
          git push origin HEAD:feat/beta-product-completion
