name: Temporary Dispatch Preflight 1.0.31

on:
  push:
    branches:
      - automation/release-1.0.31

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact release SHA
        shell: bash
        run: |
          git fetch origin main --no-tags
          actual="$(git rev-parse origin/main)"
          expected="b3746b515178a6c74e54cb2c7c3e6c669ca93338"
          if [ "$actual" != "$expected" ]; then
            echo "::error::main moved. Expected $expected but found $actual"
            exit 1
          fi

      - name: Dispatch official Release Preflight on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-preflight.yml/dispatches" \
            -d '{"ref":"main"}'
