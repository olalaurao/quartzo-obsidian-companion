name: Temporary Publish 1.0.31

on:
  push:
    branches:
      - automation/release-1.0.31

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: b3746b515178a6c74e54cb2c7c3e6c669ca93338
      RELEASE_TAG: 1.0.31
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact main SHA and unused tag
        shell: bash
        run: |
          git fetch origin main --no-tags
          actual="$(git rev-parse origin/main)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::main moved. Expected $EXPECTED_SHA but found $actual"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; refusing to move or rewrite it."
            exit 1
          fi

      - name: Require successful official preflight for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-preflight.yml/runs?branch=main&event=workflow_dispatch&status=completed&per_page=100")"
          matches="$(printf '%s' "$response" | jq --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
          if [ "$matches" -lt 1 ]; then
            echo "::error::No successful Release Preflight exists for exact SHA $EXPECTED_SHA"
            exit 1
          fi

      - name: Create annotated release tag on exact SHA
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$EXPECTED_SHA" -m "Quartzo Companion $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch canonical Release for automated tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"release_tag\":\"$RELEASE_TAG\"}}"
