name: First-run safe DOM fix

on:
  push:
    branches:
      - feat/beta-product-completion
    paths:
      - scripts/fix-first-run-safe-dom.mjs
      - .github/workflows/first-run-safe-dom.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-product-completion
          fetch-depth: 0
      - run: node scripts/fix-first-run-safe-dom.mjs
      - name: Commit patched main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git diff --cached --check
          git commit -m "fix(ui): remove remaining unsafe innerHTML"
          git push origin HEAD:feat/beta-product-completion
