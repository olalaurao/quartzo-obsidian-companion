name: Agent V1 UI Repair

on:
  push:
    branches: [ fix/sync-runtime-contract-compliance ]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-runtime-contract-compliance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply V1 shell/shared-settings repair
        run: python scripts/agent_v1_ui_repair.py
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify canonical contracts
        run: npm run contracts:verify
        env:
          GITHUB_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:contracts
      - run: npm run test:sync
      - run: npm run architecture:check
      - run: npm run build
      - run: npm run release:validate
      - run: npm run smoke:clean-artifact
      - name: Commit validated repair
        run: |
          rm scripts/agent_v1_ui_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): align Companion V1 shell and shared settings" || exit 0
          git push origin HEAD:fix/sync-runtime-contract-compliance
