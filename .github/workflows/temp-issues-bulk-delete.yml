name: Temporary Issues Bulk Delete Patch

on:
  push:
    branches:
      - work/issues-bulk-delete
    paths:
      - scripts/temp-bulk-delete-trigger.txt

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/issues-bulk-delete
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply exact source patch
        run: python scripts/temp-patch-issues-bulk-delete.py

      - name: Add anti-resurrection regression cases
        run: python scripts/temp-bulk-delete-regressions.py

      - name: Normalize generated documentation EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['guidelines.md', 'agents.md', 'docs/specs/object-organization.md']:
              path = Path(filename)
              path.write_text(path.read_text().rstrip() + '\n')
          PY

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run relevant UI/core tests
        run: npm test -- tests/ui/issues-resolution-actions.test.ts tests/ui/issues-bulk-delete.test.ts tests/core/object-organization/issues-projection.test.ts tests/core/object-organization/retire.test.ts

      - name: Run sync regression suite
        run: npm run test:sync

      - name: Architecture check
        run: npm run architecture:check

      - name: Remove temporary patch machinery
        run: |
          rm scripts/temp-patch-issues-bulk-delete.py
          rm scripts/temp-bulk-delete-regressions.py
          rm scripts/temp-bulk-delete-trigger.txt
          rm .github/workflows/temp-issues-bulk-delete.yml

      - name: Verify diff
        run: git diff --check

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add sync-safe bulk delete for Organization Issues'
          git push origin HEAD:work/issues-bulk-delete
