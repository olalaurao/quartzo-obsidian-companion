name: Generate Final Contract Lock

on:
  push:
    branches:
      - work/sync-final-quartzo-fixtures
    paths:
      - .github/workflows/sync-final-contracts.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sync-final-quartzo-fixtures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync canonical contracts from final Quartzo SHA
        run: node scripts/sync-contracts.mjs sync 72d8427358b7f2dacf260bde2aa140044bd2d520
        env:
          GITHUB_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
      - name: Commit canonical contract output
        run: |
          git config user.name 'quartzo-ci-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add contracts/UPSTREAM.lock.json contracts/quartzo
          if git diff --cached --quiet; then
            echo 'Contracts already match final Quartzo SHA.'
          else
            git commit -m 'chore: sync contracts from final Quartzo SHA'
            git push origin HEAD:work/sync-final-quartzo-fixtures
          fi
      - name: Upload canonical sync output
        uses: actions/upload-artifact@v4
        with:
          name: final-contract-sync-output
          path: |
            contracts/UPSTREAM.lock.json
            contracts/quartzo
          if-no-files-found: error
          retention-days: 1
