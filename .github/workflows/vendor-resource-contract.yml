name: Vendor canonical Resource contract

on:
  push:
    branches:
      - feat/beta-product-completion
    paths:
      - .github/workflows/vendor-resource-contract.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-product-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor upstream contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-contracts.mjs sync 86a04ff8ce552991548b07ec5ab17170fc389d2c
      - name: Verify vendored contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-contracts.mjs verify
      - name: Commit vendored contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts
          git diff --cached --check
          git commit -m "chore(contracts): pin Resource contract upstream"
          git push origin HEAD:feat/beta-product-completion
