name: Record Quick Add patch

on:
  push:
    branches:
      - feat/beta-product-completion
    paths:
      - scripts/patch-record-quick-add.mjs
      - .github/workflows/record-quick-add-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-product-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-record-quick-add.mjs
      - name: Commit Record Quick Add
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/objects/parser.ts src/core/object-creation.ts src/ui/shell/view.ts
          git diff --cached --check
          git commit -m "feat(record): add Tracker-driven Quick Add"
          git push origin HEAD:feat/beta-product-completion
