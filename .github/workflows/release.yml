name: Release

on:
  push:
    tags:
      - '0.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
      QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET }}
      RELEASE_MODE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Require tag commit on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

      - name: Require production OAuth Client ID
        shell: bash
        run: |
          if [ -z "$QUARTZO_GOOGLE_DESKTOP_CLIENT_ID" ]; then
            echo "::error::Repository secret QUARTZO_GOOGLE_DESKTOP_CLIENT_ID is not configured."
            exit 1
          fi
          case "$QUARTZO_GOOGLE_DESKTOP_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "::error::QUARTZO_GOOGLE_DESKTOP_CLIENT_ID does not look like a Google Desktop OAuth client ID."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci --audit=false

      - name: Pin modern npm audit client
        run: npm install --global npm@11.19.1
      
      - name: Audit dependencies
        run: npm run audit:prod
      
      - name: Verify contracts
        run: npm run contracts:verify
        env:
          GITHUB_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Run tests
        run: npm test
      
      - name: Run contract tests
        run: npm run test:contracts
      
      - name: Run sync tests
        run: npm run test:sync
      
      - name: Architecture check
        run: npm run architecture:check
      
      - name: Build
        run: npm run build
        env:
          QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
          QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET }}
      
      - name: Release validate (production mode)
        run: RELEASE_MODE=true npm run release:validate
        env:
          RELEASE_MODE: 'true'
          QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
      
      - name: Clean artifact smoke test
        run: npm run smoke:clean-artifact
      
      - name: Package validated release artifact
        run: npm run release:package

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartzo-companion-${{ github.ref_name }}
          path: .release-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .release-artifact/main.js
            .release-artifact/manifest.json
            .release-artifact/styles.css
            .release-artifact/SHA256SUMS.txt
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
