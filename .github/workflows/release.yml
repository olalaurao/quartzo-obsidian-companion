name: Release

on:
  push:
    tags:
      - '0.*.*'
      - '1.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to validate and publish (for example 1.0.31)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
      QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET }}
      RELEASE_MODE: 'true'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify release tag commit
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[01]\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main --no-tags
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$release_sha" != "$checkout_sha" ]; then
            echo "::error::Checkout SHA $checkout_sha does not match tag $RELEASE_TAG commit $release_sha."
            exit 1
          fi
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Require tag commit on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

      - name: Require successful Release Preflight for tag commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          successful_preflights="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-preflight.yml/runs?branch=main&event=workflow_dispatch&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == env.RELEASE_SHA and .conclusion == "success")] | length'
          )"
          if [ "${successful_preflights:-0}" -lt 1 ]; then
            echo "::error::No successful Release Preflight exists for tagged commit ${RELEASE_SHA}. Run Release Preflight on this exact main commit before publishing ${RELEASE_TAG}."
            exit 1
          fi

      - name: Require production OAuth Client ID
        shell: bash
        run: |
          if [ -z "$QUARTZO_GOOGLE_DESKTOP_CLIENT_ID" ]; then
            echo "::error::Repository secret QUARTZO_GOOGLE_DESKTOP_CLIENT_ID is not configured."
            exit 1
          fi
          case "$QUARTZO_GOOGLE_DESKTOP_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "::error::QUARTZO_GOOGLE_DESKTOP_CLIENT_ID does not look like a Google Desktop OAuth client ID."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci --audit=false

      - name: Pin modern npm audit client
        run: npm install --global npm@11.19.1
      
      - name: Audit dependencies
        run: npm run audit:prod
      
      - name: Verify contracts
        run: npm run contracts:verify
        env:
          GITHUB_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Run tests
        run: npm test
      
      - name: Run contract tests
        run: npm run test:contracts
      
      - name: Run sync tests
        run: npm run test:sync
      
      - name: Architecture check
        run: npm run architecture:check
      
      - name: Build
        run: npm run build
        env:
          QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
          QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET }}
      
      - name: Release validate (production mode)
        shell: bash
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" RELEASE_MODE=true npm run release:validate
        env:
          RELEASE_MODE: 'true'
          QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
          QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_SECRET }}
      
      - name: Clean artifact smoke test
        run: npm run smoke:clean-artifact
      
      - name: Package validated release artifact
        run: npm run release:package

      - name: Revalidate tag before publication
        shell: bash
        run: |
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          current_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag moved during validation: expected $RELEASE_SHA but found $current_sha."
            exit 1
          fi

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartzo-companion-${{ env.RELEASE_TAG }}
          path: .release-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            .release-artifact/main.js
            .release-artifact/manifest.json
            .release-artifact/styles.css
            .release-artifact/SHA256SUMS.txt
          draft: false
          prerelease: ${{ startsWith(env.RELEASE_TAG, '0.') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
