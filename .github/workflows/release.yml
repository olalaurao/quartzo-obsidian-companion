name: Release

on:
  push:
    tags:
      - '0.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
      RELEASE_MODE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Require production OAuth Client ID
        shell: bash
        run: |
          if [ -z "$QUARTZO_GOOGLE_DESKTOP_CLIENT_ID" ]; then
            echo "::error::Repository secret QUARTZO_GOOGLE_DESKTOP_CLIENT_ID is not configured."
            exit 1
          fi
          case "$QUARTZO_GOOGLE_DESKTOP_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "::error::QUARTZO_GOOGLE_DESKTOP_CLIENT_ID does not look like a Google Desktop OAuth client ID."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      
      - name: Verify contracts
        run: npm run contracts:verify
        env:
          GITHUB_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Run tests
        run: npm test
      
      - name: Run contract tests
        run: npm run test:contracts
      
      - name: Run sync tests
        run: npm run test:sync
      
      - name: Architecture check
        run: npm run architecture:check
      
      - name: Build
        run: npm run build
        env:
          QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
      
      - name: Release validate (production mode)
        run: RELEASE_MODE=true npm run release:validate
        env:
          RELEASE_MODE: 'true'
          QUARTZO_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.QUARTZO_GOOGLE_DESKTOP_CLIENT_ID }}
      
      - name: Clean artifact smoke test
        run: npm run smoke:clean-artifact
      
      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartzo-companion-${{ github.ref_name }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
