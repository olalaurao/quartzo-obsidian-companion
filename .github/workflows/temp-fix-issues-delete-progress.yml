name: Temporary Fix Issues Delete Progress

on:
  push:
    branches:
      - fix/issues-delete-progress-open-title

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/issues-delete-progress-open-title
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          delete_modal = 'src/ui/organization/delete-modal.ts'
          replace_once(
              delete_modal,
              """interface DeletePreview {\n  requests: CanonicalRetirementRequest[];\n  blockers: string[];\n  syncBlockers: CanonicalRetirePreflightBlocker[];\n}\n""",
              """interface DeletePreview {\n  requests: CanonicalRetirementRequest[];\n  blockers: string[];\n  syncBlockers: CanonicalRetirePreflightBlocker[];\n}\n\ninterface DeletePreflightProgress {\n  phase: 'checking_files' | 'checking_sync';\n  completed: number;\n  total: number;\n}\n""",
          )
          replace_once(
              delete_modal,
              """  private preview: DeletePreview | null = null;\n  private isApplying = false;\n""",
              """  private preview: DeletePreview | null = null;\n  private preflightProgress: DeletePreflightProgress | null = null;\n  private isApplying = false;\n""",
          )
          replace_once(
              delete_modal,
              """  async onOpen(): Promise<void> {\n    await this.refreshPreview();\n    this.render();\n  }\n""",
              """  async onOpen(): Promise<void> {\n    // Render before any vault reads so large selections never open as a blank modal.\n    this.render();\n    try {\n      await this.refreshPreview();\n    } catch (error) {\n      this.preflightProgress = null;\n      this.preview = {\n        requests: [],\n        blockers: [`Unable to prepare delete: ${error instanceof Error ? error.message : String(error)}`],\n        syncBlockers: [],\n      };\n    }\n    this.render();\n  }\n""",
          )
          replace_once(
              delete_modal,
              """    const requests: CanonicalRetirementRequest[] = [];\n    const blockers: string[] = [];\n    const usedTombstonePaths = new Map<string, string>();\n""",
              """    const requests: CanonicalRetirementRequest[] = [];\n    const blockers: string[] = [];\n    const usedTombstonePaths = new Map<string, string>();\n    this.preview = null;\n    this.preflightProgress = { phase: 'checking_files', completed: 0, total: paths.length };\n    this.render();\n""",
          )
          replace_once(
              delete_modal,
              """    for (const path of paths) {\n      if (path === 'app' || path.startsWith('app/') || path === '_deleted' || path.startsWith('_deleted/')) {\n        blockers.push(`${path}: system paths cannot be deleted from Organization Issues.`);\n        continue;\n      }\n\n      const file = this.context.app.vault.getAbstractFileByPath(path);\n      if (!(file instanceof TFile) || file.extension.toLowerCase() !== 'md') {\n        blockers.push(`${path}: Markdown file no longer exists.`);\n        continue;\n      }\n\n      const markdown = await this.context.app.vault.read(file);\n      const indexedObject = index\n        ? Array.from(index.objects.values()).find(object => normalizePath(object.path) === path)\n        : undefined;\n      const parsed = ObjectParser.parseMarkdown(markdown);\n      const explicitId = typeof parsed.frontmatter.id === 'string' ? parsed.frontmatter.id.trim() : '';\n      const id = indexedObject?.id || explicitId || createCanonicalObjectId();\n      const tombstonePath = normalizePath(canonicalRetirementPath(id));\n      const priorSource = usedTombstonePaths.get(tombstonePath);\n      if (priorSource && priorSource !== path) {\n        blockers.push(\n          `${path}: shares object ID ${id} with ${priorSource}; deleting both would collide at ${tombstonePath}. Resolve the duplicate ID first or delete one at a time.`,\n        );\n        continue;\n      }\n      usedTombstonePaths.set(tombstonePath, path);\n\n      const occupiedTombstone = this.context.app.vault.getAbstractFileByPath(tombstonePath);\n      if (occupiedTombstone) {\n        blockers.push(`${path}: tombstone destination already exists at ${tombstonePath}.`);\n        continue;\n      }\n\n      requests.push({\n        path,\n        id,\n        expectedMarkdown: markdown,\n        deletedAt: new Date().toISOString(),\n      });\n    }\n""",
              """    for (let position = 0; position < paths.length; position += 1) {\n      const path = paths[position]!;\n      try {\n        if (path === 'app' || path.startsWith('app/') || path === '_deleted' || path.startsWith('_deleted/')) {\n          blockers.push(`${path}: system paths cannot be deleted from Organization Issues.`);\n          continue;\n        }\n\n        const file = this.context.app.vault.getAbstractFileByPath(path);\n        if (!(file instanceof TFile) || file.extension.toLowerCase() !== 'md') {\n          blockers.push(`${path}: Markdown file no longer exists.`);\n          continue;\n        }\n\n        const markdown = await this.context.app.vault.read(file);\n        const indexedObject = index\n          ? Array.from(index.objects.values()).find(object => normalizePath(object.path) === path)\n          : undefined;\n        const parsed = ObjectParser.parseMarkdown(markdown);\n        const explicitId = typeof parsed.frontmatter.id === 'string' ? parsed.frontmatter.id.trim() : '';\n        const id = indexedObject?.id || explicitId || createCanonicalObjectId();\n        const tombstonePath = normalizePath(canonicalRetirementPath(id));\n        const priorSource = usedTombstonePaths.get(tombstonePath);\n        if (priorSource && priorSource !== path) {\n          blockers.push(\n            `${path}: shares object ID ${id} with ${priorSource}; deleting both would collide at ${tombstonePath}. Resolve the duplicate ID first or delete one at a time.`,\n          );\n          continue;\n        }\n        usedTombstonePaths.set(tombstonePath, path);\n\n        const occupiedTombstone = this.context.app.vault.getAbstractFileByPath(tombstonePath);\n        if (occupiedTombstone) {\n          blockers.push(`${path}: tombstone destination already exists at ${tombstonePath}.`);\n          continue;\n        }\n\n        requests.push({\n          path,\n          id,\n          expectedMarkdown: markdown,\n          deletedAt: new Date().toISOString(),\n        });\n      } finally {\n        const completed = position + 1;\n        if (completed === paths.length || completed % 25 === 0) {\n          this.preflightProgress = { phase: 'checking_files', completed, total: paths.length };\n          this.render();\n          await new Promise<void>(resolve => window.setTimeout(resolve, 0));\n        }\n      }\n    }\n""",
          )
          replace_once(
              delete_modal,
              """    if (requests.length > 0 && blockers.length === 0 && this.context.plugin.settings.isPaired) {\n      const coordinator = this.context.driveSyncCoordinator ?? this.context.plugin.driveSyncCoordinator;\n""",
              """    if (requests.length > 0 && blockers.length === 0 && this.context.plugin.settings.isPaired) {\n      this.preflightProgress = { phase: 'checking_sync', completed: 0, total: requests.length };\n      this.render();\n      await new Promise<void>(resolve => window.setTimeout(resolve, 0));\n      const coordinator = this.context.driveSyncCoordinator ?? this.context.plugin.driveSyncCoordinator;\n""",
          )
          replace_once(
              delete_modal,
              """    this.preview = { requests, blockers, syncBlockers };\n  }\n""",
              """    this.preview = { requests, blockers, syncBlockers };\n    this.preflightProgress = null;\n  }\n""",
          )
          replace_once(
              delete_modal,
              """    if (!this.preview) {\n      contentEl.createEl('p', { text: 'Checking deletion safety…' });\n      return;\n    }\n""",
              """    if (!this.preview) {\n      const status = contentEl.createEl('div', { cls: 'qz-empty-state' });\n      status.setAttribute('role', 'status');\n      status.setAttribute('aria-live', 'polite');\n      const progress = this.preflightProgress;\n      if (progress?.phase === 'checking_files') {\n        status.createEl('p', {\n          text: `Checking files ${progress.completed}/${progress.total}…`,\n        });\n        const progressBar = status.createEl('progress');\n        progressBar.max = Math.max(1, progress.total);\n        progressBar.value = progress.completed;\n        progressBar.setAttribute('aria-label', 'Bulk delete file safety preflight');\n      } else if (progress?.phase === 'checking_sync') {\n        status.createEl('p', {\n          text: `Checking sync safety for ${progress.total} selected file${progress.total === 1 ? '' : 's'}…`,\n        });\n        status.createEl('small', {\n          text: 'Quartzo is verifying the canonical Drive baseline before any deletion is allowed.',\n          cls: 'qz-text-muted',\n        });\n      } else {\n        status.createEl('p', { text: 'Checking deletion safety…' });\n      }\n      return;\n    }\n""",
          )

          shell = 'src/ui/shell/view.ts'
          replace_once(
              shell,
              """    const openBulkDelete = (files: string[]): void => {\n      if (files.length === 0) return;\n      const { ObjectBulkDeleteModal } = require('../organization/delete-modal');\n      new ObjectBulkDeleteModal(this.context, {\n        files,\n        onApplied: async () => {\n          this.issueSelectedPaths.clear();\n          await this.render();\n        },\n      }).open();\n    };\n""",
              """    const openBulkDelete = (files: string[]): void => {\n      if (files.length === 0) return;\n      const { ObjectBulkDeleteModal } = require('../organization/delete-modal');\n      new ObjectBulkDeleteModal(this.context, {\n        files,\n        onApplied: async () => {\n          this.issueSelectedPaths.clear();\n          await this.render();\n        },\n      }).open();\n    };\n\n    const openIssueMarkdown = (path: string): void => {\n      const file = this.context.app.vault.getAbstractFileByPath(path);\n      if (!(file instanceof TFile)) {\n        new Notice(`Markdown file no longer exists: ${path}`);\n        return;\n      }\n      void this.context.app.workspace.openLinkText(path, '', true);\n    };\n""",
          )
          replace_once(
              shell,
              """        const infoTd = row.createEl('td');\n        infoTd.createEl('strong', { text: issue.title });\n        infoTd.createEl('br');\n""",
              """        const infoTd = row.createEl('td');\n        const titleLink = infoTd.createEl('a', {\n          text: issue.title,\n          cls: 'internal-link',\n          attr: { href: '#', 'data-href': issue.subjectPath, title: 'Open Markdown in Obsidian' },\n        });\n        titleLink.addEventListener('click', event => {\n          event.preventDefault();\n          openIssueMarkdown(issue.subjectPath);\n        });\n        infoTd.createEl('br');\n""",
          )
          replace_once(
              shell,
              """          openMarkdown.addEventListener('click', () => {\n            void this.context.app.workspace.openLinkText(issue.subjectPath, '', true);\n          });\n""",
              """          openMarkdown.addEventListener('click', () => {\n            openIssueMarkdown(issue.subjectPath);\n          });\n""",
          )

          bulk_test = 'tests/ui/issues-bulk-delete.test.ts'
          p = Path(bulk_test)
          text = p.read_text()
          insert = """\n  it('renders observable preflight progress before scanning a large selection', () => {\n    expect(deleteModalSource).toMatch(/async onOpen\(\): Promise<void> \{[\\s\\S]*?this\\.render\(\);[\\s\\S]*?await this\\.refreshPreview\(\)/);\n    expect(deleteModalSource).toContain("phase: 'checking_files'");\n    expect(deleteModalSource).toContain('Checking files ${progress.completed}/${progress.total}…');\n    expect(deleteModalSource).toContain("phase: 'checking_sync'");\n    expect(deleteModalSource).toContain('Checking sync safety for ${progress.total} selected file');\n    expect(deleteModalSource).toContain("status.setAttribute('role', 'status')");\n    expect(deleteModalSource).toContain('window.setTimeout(resolve, 0)');\n  });\n"""
          marker = "\n  it('uses canonical retirement instead of raw vault deletion', () => {"
          if marker not in text:
              raise SystemExit('Bulk delete test insertion marker missing')
          p.write_text(text.replace(marker, insert + marker, 1))

          actions_test = 'tests/ui/issues-resolution-actions.test.ts'
          p = Path(actions_test)
          text = p.read_text()
          insert = """\n  it('opens the exact Issue Markdown when its title is clicked', () => {\n    expect(shellSource).toContain("const openIssueMarkdown = (path: string): void =>");\n    expect(shellSource).toContain("cls: 'internal-link'");\n    expect(shellSource).toContain("title: 'Open Markdown in Obsidian'");\n    expect(shellSource).toContain('openIssueMarkdown(issue.subjectPath)');\n  });\n"""
          marker = "\n  it('reprojects Issues after an applied organization operation instead of hiding rows optimistically', () => {"
          if marker not in text:
              raise SystemExit('Issues action test insertion marker missing')
          p.write_text(text.replace(marker, insert + marker, 1))

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Validate focused regression
        run: |
          npm run typecheck
          npm run lint
          npx vitest run tests/ui/issues-bulk-delete.test.ts tests/ui/issues-resolution-actions.test.ts
          npm run architecture:check
          git diff --check

      - name: Commit product fix and remove helper
        shell: bash
        run: |
          git rm .github/workflows/temp-fix-issues-delete-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/organization/delete-modal.ts src/ui/shell/view.ts tests/ui/issues-bulk-delete.test.ts tests/ui/issues-resolution-actions.test.ts
          git commit -m 'fix: make issue bulk delete preflight visible'
          git push origin HEAD:fix/issues-delete-progress-open-title
