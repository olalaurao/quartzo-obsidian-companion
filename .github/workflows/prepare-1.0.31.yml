name: Temporary Prepare 1.0.31

on:
  push:
    branches:
      - release/1.0.31

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.0.31
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record permanent release-trigger rule
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'guidelines.md';
          const source = fs.readFileSync(path, 'utf8');
          const before = '43. **Release metadata e preflight são atômicos:** todo bump de release deve usar o caminho canônico `npm run release:prepare -- <version>` para alinhar `package.json`, `manifest.json`, `versions.json` e `package-lock.json` quando presente. O commit candidato só pode ser tagueado depois de CI verde e de um `Release Preflight` verde para o mesmo SHA de `main`; o workflow de Release deve falhar fechado se não encontrar esse preflight exato. Nunca force-mover/regravar tag que já produziu GitHub Release; uma tentativa falha/não publicada deve ser sucedida por uma nova versão limpa.';
          const after = before + ' Um push de tag originado pelo `GITHUB_TOKEN` de um workflow não pode ser tratado como gatilho recursivo confiável: quando automação criar a tag com esse token, deve disparar explicitamente o mesmo workflow canônico `Release` com `release_tag`, e esse workflow deve resolver a tag existente, provar novamente SHA em `main`, Preflight verde no mesmo SHA e tag↔versão antes de publicar. Não criar segundo workflow de publicação para contornar essa regra.';
          if (!source.includes(before)) throw new Error('Canonical guideline 43 text not found; refusing partial release-rule edit.');
          if (source.includes(after)) throw new Error('Guideline 43 already contains the release-trigger rule.');
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Run canonical release preparation
        run: npm run release:prepare -- 1.0.31

      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ' | sed 's/ $//')"
          expected="guidelines.md manifest.json package-lock.json package.json versions.json"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected canonical preparation diff: $actual"
            exit 1
          fi

      - name: Commit prepared rule and metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guidelines.md package.json manifest.json versions.json package-lock.json
          git commit -m 'chore: prepare release 1.0.31'
          git push origin HEAD:release/1.0.31
