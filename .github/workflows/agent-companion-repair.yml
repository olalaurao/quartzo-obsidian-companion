name: Agent Companion Repair

on:
  push:
    branches: [fix/sync-runtime-contract-compliance]
    paths:
      - '.github/workflows/agent-companion-repair.yml'
      - '.github/scripts/agent_companion_repair.py'
      - '.github/scripts/agent_companion_repair2.py'
      - '.github/scripts/agent_companion_repair3.py'
      - '.github/scripts/agent_companion_repair4.py'
      - '.github/scripts/agent_companion_repair5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-validate-commit:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-runtime-contract-compliance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Apply repair
        run: |
          python3 .github/scripts/agent_companion_repair.py
          python3 .github/scripts/agent_companion_repair2.py
          python3 .github/scripts/agent_companion_repair3.py
          python3 .github/scripts/agent_companion_repair4.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/agent_companion_repair5.py')
          s = p.read_text(encoding='utf-8')
          old = "      this.authState = 'paired';\n      await this.saveSettings();"
          new = "    this.authState = 'paired';\n      await this.saveSettings();"
          if old not in s:
              raise SystemExit('repair5 compatibility target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/agent_companion_repair5.py
      - name: Regenerate dependency lock
        run: npm install --package-lock-only
      - name: Clean install
        run: npm ci
      - name: Vendor contracts from validated upstream SHA
        env:
          GITHUB_TOKEN: ${{ env.UPSTREAM_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN" || { echo 'QUARTZO_UPSTREAM_TOKEN is required for cross-repo verification'; exit 1; }
          node scripts/sync-contracts.mjs sync 0f5beed2ca7ff80d841efb97eca277bcc16a163e
      - name: Verify contracts against upstream
        env:
          GITHUB_TOKEN: ${{ env.UPSTREAM_TOKEN }}
        run: npm run contracts:verify
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Contract tests
        run: npm run test:contracts
      - name: Sync tests
        run: npm run test:sync
      - name: Architecture gate
        run: npm run architecture:check
      - name: Build
        run: npm run build
      - name: Release validation
        run: npm run release:validate
      - name: Clean artifact smoke
        run: npm run smoke:clean-artifact
      - name: Commit validated product changes
        shell: bash
        run: |
          # Workflow files are committed separately through the GitHub integration,
          # because GITHUB_TOKEN is intentionally not allowed to modify workflows.
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/agent-companion-repair.yml
          git rm -f .github/scripts/agent_companion_repair.py \
            .github/scripts/agent_companion_repair2.py \
            .github/scripts/agent_companion_repair3.py \
            .github/scripts/agent_companion_repair4.py \
            .github/scripts/agent_companion_repair5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden cross-client sync runtime"
          git push origin HEAD:fix/sync-runtime-contract-compliance
