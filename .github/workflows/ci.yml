name: CI

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: node scripts/audit-prod.mjs
    - name: Verify canonical contracts
      run: npm run contracts:verify
      env:
        GITHUB_TOKEN: ${{ secrets.QUARTZO_UPSTREAM_TOKEN }}
    - run: npm run typecheck
    - run: npm run lint
    - run: npm test
    - run: npm run test:contracts
    - run: npm run test:sync
    - run: npm run architecture:check
    - run: npm run build
    - run: npm run release:validate
    - run: npm run smoke:clean-artifact
    - run: npm run release:package

  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: node scripts/audit-prod.mjs
    - run: npm run typecheck
    - run: npm run test:sync
    - run: npm run build
    - run: npm run smoke:clean-artifact
    - run: npm run release:package
