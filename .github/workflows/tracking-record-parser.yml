name: TrackingRecord parser fix

on:
  push:
    branches:
      - feat/beta-product-completion
    paths:
      - scripts/patch-tracking-record-parser.mjs
      - .github/workflows/tracking-record-parser.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-product-completion
          fetch-depth: 0
      - run: node scripts/patch-tracking-record-parser.mjs
      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/objects/parser.ts
          git diff --cached --check
          git commit -m "fix(objects): parse canonical TrackingRecord fields"
          git push origin HEAD:feat/beta-product-completion
