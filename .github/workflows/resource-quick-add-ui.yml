name: Resource Quick Add UI patch

on:
  push:
    branches:
      - feat/beta-product-completion
    paths:
      - scripts/patch-resource-quick-add-ui.mjs
      - .github/workflows/resource-quick-add-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-product-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-resource-quick-add-ui.mjs
      - name: Commit Resource Quick Add UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/shell/view.ts
          git diff --cached --check
          git commit -m "feat(resource): add Quick Add capture form"
          git push origin HEAD:feat/beta-product-completion
